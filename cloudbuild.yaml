steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/merchantmaxx/github.com/divy-jn/merchant-maxx:$COMMIT_SHA', '-f', 'Dockerfile', '.']
  dir: 'backend'
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/merchantmaxx/github.com/divy-jn/merchant-maxx:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'merchant-maxx-api'
  - '--image'
  - 'gcr.io/merchantmaxx/github.com/divy-jn/merchant-maxx:$COMMIT_SHA'
  - '--region'
  - 'us-central1'
images:
- 'gcr.io/merchantmaxx/github.com/divy-jn/merchant-maxx:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
